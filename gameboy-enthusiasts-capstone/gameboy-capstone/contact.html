<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Game Boy Enthusiasts</title>
  <link rel="stylesheet" href="style.css">

  <!--
    ASSET INVENTORY: No images, SVG, audio, video, or embeds on this page.
    Typography & layout inherit from style.css (system font stack, measure, etc.).
  -->
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="navbar">
    <div class="container">
      <div class="nav-logo">
        <a href="index.html">Game Boy Enthusiasts</a>
      </div>
      <nav aria-label="Primary">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="database.html">Database</a></li>
          <li><a href="contact.html" class="current" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <div class="container container--narrow">
      <h1>Want to Connect?</h1>
      <p>If you have questions, feedback, or just want to say hello, we'd love to hear from you!</p>
      <p id="form-instructions" class="form-instructions">
        All fields are required. We use your email only to reply to your message.
      </p>

      <form action="/submit-form-endpoint" method="POST" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            autocomplete="name"
            aria-required="true"
            aria-describedby="form-instructions"
            placeholder="Your name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            aria-required="true"
            aria-describedby="form-instructions"
            placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            required
            aria-required="true"
            aria-describedby="form-instructions"
            placeholder="What’s on your mind?"></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Game Boy Enthusiasts</p>
    </div>
  </footer>
</body>
</html>
